<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A catalog of public Hello Interview YouTube videos." />
    <title>Hello Interview Video Catalog</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b1020;
        color: #eef2ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 48px 24px 72px;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: end;
        margin-bottom: 36px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.055em;
      }
      header p {
        color: #a5b4fc;
        margin: 10px 0 0;
        line-height: 1.5;
      }
      .channel-link,
      .watch {
        color: #fff;
        background: #e11d48;
        padding: 11px 16px;
        border-radius: 10px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }
      .channel-link:hover,
      .watch:hover {
        background: #be123c;
      }
      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(2, minmax(150px, auto));
        gap: 12px;
        margin-bottom: 18px;
      }
      .control {
        min-height: 44px;
        border: 1px solid #42526f;
        border-radius: 9px;
        background: #111936;
        color: #eef2ff;
        font: inherit;
        padding: 10px 12px;
      }
      .control:focus-visible,
      .channel-link:focus-visible,
      .watch:focus-visible,
      h2 a:focus-visible {
        outline: 3px solid #fda4af;
        outline-offset: 3px;
      }
      #video-count {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 22px;
      }
      .card {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid #263353;
        border-radius: 14px;
        background: #111936;
        box-shadow: 0 8px 28px #02061755;
      }
      .thumbnail {
        position: relative;
        aspect-ratio: 16 / 9;
        display: block;
        background: #1e293b;
      }
      .thumbnail img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .duration {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 3px 6px;
        border-radius: 4px;
        background: #020617e8;
        color: #fff;
        font-size: 0.76rem;
        font-weight: 700;
      }
      .content {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 17px;
      }
      h2 {
        margin: 0;
        font-size: 1.06rem;
        line-height: 1.35;
        letter-spacing: -0.015em;
      }
      h2 a {
        color: inherit;
        text-decoration: none;
      }
      h2 a:hover {
        color: #fda4af;
      }
      .description {
        flex: 1;
        margin: 10px 0 16px;
        color: #bec8e8;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #94a3b8;
        font-size: 0.8rem;
      }
      .metadata {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        color: #a5b4fc;
        font-size: 0.78rem;
      }
      .watch {
        padding: 7px 10px;
        border-radius: 7px;
        font-size: 0.8rem;
      }
      @media (max-width: 620px) {
        main {
          padding: 32px 16px 48px;
        }
        header {
          grid-template-columns: 1fr;
        }
        .channel-link {
          width: fit-content;
        }
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Hello Interview</h1>
          <p>Public YouTube video catalog, newest first. Metadata collected July 22, 2026.</p>
        </div>
        <a class="channel-link" href="https://www.youtube.com/@hello_interview/videos" target="_blank" rel="noreferrer">Open channel</a>
      </header>
      <div class="controls" aria-label="Video filters">
        <input class="control" id="video-search" type="search" placeholder="Search videos" aria-label="Search videos" />
        <select class="control" id="length-filter" aria-label="Filter by video length">
          <option value="all">All lengths</option>
          <option value="short">Under 15 minutes</option>
          <option value="medium">15 to 30 minutes</option>
          <option value="long">30 to 60 minutes</option>
          <option value="extended">Over 60 minutes</option>
        </select>
        <select class="control" id="video-sort" aria-label="Sort videos">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="views-desc">Most views</option>
          <option value="views-asc">Fewest views</option>
          <option value="duration-desc">Longest</option>
          <option value="duration-asc">Shortest</option>
        </select>
      </div>
      <div id="video-count" aria-live="polite"></div>
      <section class="grid" id="videos" aria-label="Video catalog"></section>
    </main>

      const formatDate = (date) => new Intl.DateTimeFormat('en', { dateStyle: 'medium', timeZone: 'UTC' }).format(new Date(`${date}T00:00:00Z`));
      const formatViews = (views) => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(views);
      const escapeHtml = (value) => value.replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
      const durationInSeconds = (duration) => duration.split(':').reduce((seconds, part) => seconds * 60 + Number(part), 0);
      const container = document.querySelector('#videos');
      const search = document.querySelector('#video-search');
      const lengthFilter = document.querySelector('#length-filter');
      const sort = document.querySelector('#video-sort');
      const count = document.querySelector('#video-count');

      function matchesLength(duration, filter) {
        const seconds = durationInSeconds(duration);
        if (filter === 'short') return seconds < 15 * 60;
        if (filter === 'medium') return seconds >= 15 * 60 && seconds < 30 * 60;
        if (filter === 'long') return seconds >= 30 * 60 && seconds < 60 * 60;
        if (filter === 'extended') return seconds >= 60 * 60;
        return true;
      }

      function renderVideos() {
        const query = search.value.trim().toLowerCase();
        const visibleVideos = videos
          .filter(([, title, duration]) => title.toLowerCase().includes(query) && matchesLength(duration, lengthFilter.value))
          .sort(([firstId, , firstDuration, firstDate], [secondId, , secondDuration, secondDate]) => {
            if (sort.value === 'oldest') return firstDate.localeCompare(secondDate);
            if (sort.value === 'views-desc') return (viewCounts[secondId] ?? 0) - (viewCounts[firstId] ?? 0);
            if (sort.value === 'views-asc') return (viewCounts[firstId] ?? 0) - (viewCounts[secondId] ?? 0);
            if (sort.value === 'duration-desc') return durationInSeconds(secondDuration) - durationInSeconds(firstDuration);
            if (sort.value === 'duration-asc') return durationInSeconds(firstDuration) - durationInSeconds(secondDuration);
            return secondDate.localeCompare(firstDate);
          });

        count.textContent = `${visibleVideos.length} of ${videos.length} public videos`;
        container.innerHTML = visibleVideos
          .map(([id, title, duration, date]) => {
            const url = `https://www.youtube.com/watch?v=${id}`;
            const safeTitle = escapeHtml(title);
            return `
          <article class="card">
            <a class="thumbnail" href="${url}" target="_blank" rel="noreferrer" aria-label="Watch ${safeTitle}">
              <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy">
              <span class="duration">${duration}</span>
            </a>
            <div class="content">
              <h2><a href="${url}" target="_blank" rel="noreferrer">${safeTitle}</a></h2>
              <p class="description">A Hello Interview video covering ${safeTitle}.</p>
              <div class="metadata"><span>${formatViews(viewCounts[id] ?? 0)} views</span><span>${duration}</span></div>
              <div class="footer">
                <time datetime="${date}">${formatDate(date)}</time>
                <a class="watch" href="${url}" target="_blank" rel="noreferrer">Watch</a>
              </div>
            </div>
          </article>`;
          })
          .join('');
      }

      [search, lengthFilter, sort].forEach((control) => control.addEventListener('input', renderVideos));
      renderVideos();

  </body>
</html>
