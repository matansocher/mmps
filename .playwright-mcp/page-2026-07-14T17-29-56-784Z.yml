  - generic [ref=e194]:
    - heading "Rules for healthy engagement" [level=2] [ref=e195]
    - list [ref=e196]:
      - listitem [ref=e197]: Do not sell score advantages, easier circles, or extra rewarded Daily Route attempts.
      - listitem [ref=e198]: Do not use paid loot boxes or chance-based cash rewards.
      - listitem [ref=e199]: Missing a day resets the current streak but never removes earned rewards or mastery.
      - listitem [ref=e200]: Reward skill, discovery, and consistency—not excessive session length.
      - listitem [ref=e201]: Keep profiles private by default and allow players to invalidate old share links.