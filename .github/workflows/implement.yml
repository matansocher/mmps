---
name: 🛠️ AI Implement (Codex)

on:
  issues:
    types: [labeled]

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      (github.actor == 'matansocher' || contains(github.actor, 'mmps-companion')) &&
      github.event.label.name == 'implement'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get GitHub Token
        id: get_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CLAUDE_GH_APP_ID }}
          private-key: ${{ secrets.CLAUDE_GH_APP_PRIVATE_KEY }}

      # persist-credentials: false keeps the app token out of .git/config, where Codex could read it.
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Codex runs without network access, so dependencies must be installed beforehand.
      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "Matan Socher"
          git config user.email "24754543+matansocher@users.noreply.github.com"

      - name: Create working branch
        id: branch
        run: |
          BRANCH="codex/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build task prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "# Feature request (GitHub issue #$ISSUE_NUMBER)"
            echo
            echo "## Title"
            echo "$ISSUE_TITLE"
            echo
            echo "## Description"
            echo "$ISSUE_BODY"
            echo
            echo "## Instructions"
            echo "- Implement the feature described above for this repository."
            echo "- Strictly follow the conventions in AGENTS.md: use 'type' (never 'interface'), named exports only (never default), repository FUNCTIONS (not classes) for DB access, async/await (never .then chains), and the path aliases (@core, @features, @services, @shared)."
            echo "- Keep the change focused and minimal — only what the request needs."
            echo "- Do NOT modify files under .github/, .husky/, .env, or anything secret-related."
            echo "- Do NOT run git commit, push, or any command that changes git history; leave your changes in the working tree."
            echo "- You have no network access and dependencies are already installed; do not add new npm packages."
            echo "- Before finishing, run 'npm run typecheck', 'npm run lint' and 'npm test', and fix any failures your change caused."
            echo "- Your final message is used as the pull request summary: a short markdown bullet list of what you changed and why."
          } > codex-task.md

      - name: Run Codex
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_KEY }}
          prompt-file: codex-task.md
          permission-profile: ':workspace'
          allow-bot-users: 'mmps-companion[bot]'

      - name: Clean up task file
        if: always()
        run: rm -f codex-task.md

      # Hooks are disabled so a hook edited by Codex cannot run outside its sandbox.
      - name: Commit changes
        id: changes
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit --no-verify -q \
            -m "feat: $ISSUE_TITLE" -m "Closes #$ISSUE_NUMBER"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build change summary
        id: summary
        if: steps.changes.outputs.changed == 'true'
        run: |
          FILE_STAT=$(git diff --stat origin/main..HEAD | tail -n 1 | sed 's/^[[:space:]]*//')
          CHANGED_FILES=$(git diff --name-only origin/main..HEAD | sed 's/^/- /')
          {
            echo "files<<SUMMARY_EOF"
            echo "Files (${FILE_STAT}):"
            echo "$CHANGED_FILES"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment when no changes were produced
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "🤖 Codex ran but produced no code changes for this request. Try rephrasing or adding more detail to the issue, then re-add the \`implement\` label."

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git -c core.hooksPath=/dev/null push --no-verify \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Open pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CODEX_SUMMARY: ${{ steps.codex.outputs.final-message }}
          CHANGED_FILES: ${{ steps.summary.outputs.files }}
        run: |
          {
            echo "Implements the request from #${ISSUE_NUMBER}."
            echo
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "## Summary"
            echo "$CODEX_SUMMARY"
            echo
            echo "$CHANGED_FILES"
            echo
            echo "---"
            echo "🤖 Generated by Codex. Please review before merging."
          } > "$RUNNER_TEMP/pr-body.md"
          URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "feat: $ISSUE_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify on Telegram
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          CHATBOT_TOKEN: ${{ secrets.CHATBOT_TELEGRAM_BOT_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHANGED_FILES: ${{ steps.summary.outputs.files }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          TEXT=$(printf '🛠️ PR ready for issue #%s (%s)\n\n%s\n\n%s' \
            "$ISSUE_NUMBER" "$ISSUE_TITLE" "$CHANGED_FILES" "$PR_URL")
          PAYLOAD=$(jq -n --arg chat_id "862305226" --arg text "$TEXT" \
            '{chat_id: $chat_id, text: $text}')
          curl -s -X POST "https://api.telegram.org/bot${CHATBOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" > /dev/null
