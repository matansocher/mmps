name: '🚀 Deploy to Heroku'

on:
  workflow_dispatch:
    inputs:
      app-name:
        description: 'Heroku app name'
        required: true
        default: mmps-a9baabab2459
        type: choice
        options:
          - mmps-a9baabab2459

permissions:
  contents: read

concurrency:
  group: 'heroku-deployment-${{ inputs.app-name }}'
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy to ${{ inputs.app-name }}'
    if: github.actor == 'matansocher'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy source to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ inputs.app-name }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::The HEROKU_API_KEY repository secret is required."
            exit 1
          fi

          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main
