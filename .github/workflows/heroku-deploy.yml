name: '🚀 Deploy to Heroku'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (must have passing CI). Defaults to main.'
        required: false
        default: 'main'

permissions:
  contents: read
  actions: read

env:
  HEROKU_APP_NAME: mmps
  DEPLOY_REF: ${{ inputs.ref || 'main' }}
  CI_WORKFLOW_FILE: ci.yml

concurrency:
  group: heroku-deployment-mmps
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy to Heroku'
    if: github.actor == 'matansocher' || contains(github.actor, 'mmps-companion')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Restrict deployable refs
        run: |
          case "$DEPLOY_REF" in
            main | refs/heads/main | v*)
              echo "Deploying ref '$DEPLOY_REF'."
              ;;
            *)
              echo "::error::Ref '$DEPLOY_REF' is not deployable. Only 'main' or a release tag (v*) may be deployed."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Resolve immutable deployment SHA
        id: sha
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved '$DEPLOY_REF' to immutable SHA ${DEPLOY_SHA}."

      - name: Require successful CI for the deployment SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          conclusion="$(gh run list \
            --workflow "$CI_WORKFLOW_FILE" \
            --branch main \
            --commit "$DEPLOY_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')"

          if [ -z "$conclusion" ]; then
            echo "::error::No completed '$CI_WORKFLOW_FILE' run found for SHA ${DEPLOY_SHA}. Deploy only commits with passing CI."
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for SHA ${DEPLOY_SHA} concluded '${conclusion}', not 'success'. Refusing to deploy unchecked code."
            exit 1
          fi

          echo "CI succeeded for SHA ${DEPLOY_SHA}."

      - name: Deploy source to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::The HEROKU_API_KEY repository secret is required."
            exit 1
          fi

          status="$(curl --silent --show-error --output /tmp/heroku-app.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.heroku+json; version=3' \
            --header "Authorization: Bearer ${HEROKU_API_KEY}" \
            "https://api.heroku.com/apps/${HEROKU_APP_NAME}")"

          case "$status" in
            200) ;;
            401)
              echo "::error::HEROKU_API_KEY is invalid or has been revoked. Generate a new API key from Heroku account settings."
              exit 1
              ;;
            403 | 404)
              echo "::error::The API key cannot access Heroku app '${HEROKU_APP_NAME}'. Confirm the app name and account access."
              exit 1
              ;;
            *)
              echo "::error::Heroku app preflight failed with HTTP status ${status}."
              cat /tmp/heroku-app.json
              exit 1
              ;;
          esac

          git push --force "https://:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" "${DEPLOY_SHA}:refs/heads/main"

      - name: Record deployment
        if: always()
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          {
            echo "### Heroku deployment"
            echo ""
            echo "- App: \`${HEROKU_APP_NAME}\`"
            echo "- Ref: \`${DEPLOY_REF}\`"
            echo "- Deployed SHA: \`${DEPLOY_SHA:-unresolved}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
