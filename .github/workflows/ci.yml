---
name: '🏗️ CI'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 'Setup Node.js'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (self-healing lockfile)
        run: |
          npm ci || {
            echo "::warning::npm ci failed — package-lock.json is out of sync with package.json (often a macOS-generated lock dropping Linux-only optional deps). Regenerating a clean lockfile with 'rm -rf node_modules package-lock.json && npm install --include=optional'."
            rm -rf node_modules package-lock.json
            npm install --include=optional
          }

      - name: Build
        run: npm run build

      - name: Type-check (src + tests)
        run: npm run typecheck

      - name: Run Tests (with coverage)
        run: npm run test:coverage

      - name: Upload code coverage
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Run ESLint
        run: npm run lint

  release:
    name: '🏷️ Release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
