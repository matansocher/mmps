---
name: '🏗️ CI'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: 'CI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: 'ci-${{ github.workflow }}-${{ github.ref }}'
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (self-healing lockfile)
        run: |
          npm ci || {
            echo "::warning::npm ci failed — package-lock.json is out of sync with package.json (often a macOS-generated lock dropping Linux-only optional deps). Regenerating a clean lockfile with 'rm -rf node_modules package-lock.json && npm install --include=optional'."
            rm -rf node_modules package-lock.json
            npm install --include=optional
          }

      - name: Build
        run: npm run build

      - name: Type-check (src + tests)
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Run ESLint
        run: npm run lint

  release:
    name: '🏷️ Release'
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
